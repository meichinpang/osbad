[project]
name = "osbad"
version = "1.6.3"
description = "OSBAD (Open-source Benchmark of Anomaly Detection)"
readme = "README.md"
authors = [
    { name = "Mei-Chin Pang", email = "mei-chin.pang@basf.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb==1.3.2",
    "llvmlite>=0.44.0",
    "matplotlib>=3.10.5",
    "natsort>=8.4.0",
    "numpy<=2.2",
    "optuna>=4.5.0",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "pyarrow>=25.0.1",
    "pyod>=2.0.5",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "torch>=2.8.0",
]
license = "Apache-2.0"
keywords = [
    "benchmark",
    "anomaly detection",
    "outlier detection",
    "unsupervised machine learning",
    "hyperparameter tuning",
    "statistics"]

[project.urls]
Documentation = "https://osbad.readthedocs.io/en/latest/"
Repository = "https://github.com/meichinpang/osbad/tree/master"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
filterwarnings = [
    # seaborn passes the deprecated `vert` kwarg internally in boxplot
    "ignore:.*will be deprecated in a future version:PendingDeprecationWarning",
]

[tool.interrogate]
fail-under = 80
ignore-init-module = true
ignore-private = false
color = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# Use static versioning
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only package the library source; exclude datasets, docs and artifacts
[tool.hatch.build.targets.wheel]
packages = ["src/osbad"]

[tool.hatch.build.targets.sdist]
only-include = ["src/osbad"]

[dependency-groups]
dev = [
    "furo>=2024.8.6",
    "interrogate>=1.7.0",
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.7",
    "jupytext>=1.17.2",
    "notebook>=7.4.5",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "sphinx>=8.1.3,<8.2",
    "sphinx-autoapi>=3.6.0",
    "sphinx-autobuild>=2024.10.3",
]
